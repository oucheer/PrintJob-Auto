name: Windows build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup dependencies
        shell: pwsh
        run: ./setup_windows.ps1
      - name: Build EXE
        shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PrintCaseStudio-Windows-x64
          path: dist/PrintCaseStudio.exe
